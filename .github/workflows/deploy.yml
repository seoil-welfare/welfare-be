# main에 merge되면 테스트 후 EC2에 배포한다 (deploy/README.md "자동 배포")
# EC2에는 SSM으로 명령을 보낸다: SSH 포트를 열지 않고, GitHub에 AWS 키나 서버 키를 저장하지 않는다.
# AWS 권한은 OIDC로 그때그때 받는다 (vars.AWS_ROLE_ARN 역할은 이 저장소의 main에서만 쓸 수 있게 만든다)
# 역할의 신뢰 조건 sub는 GitHub의 새 형식이다: repo:seoil-welfare@<조직 ID>/welfare-be@<저장소 ID>:ref:refs/heads/main
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:          # Actions 탭에서 손으로 다시 배포할 때

concurrency:
  group: deploy               # 배포가 겹치지 않게 차례로
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x gradlew && ./gradlew test --no-daemon

  deploy:
    needs: test               # 테스트가 실패하면 배포하지 않는다
    runs-on: ubuntu-latest
    permissions:
      id-token: write         # OIDC로 AWS 임시 권한 받기
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: EC2에서 deploy.sh 실행 (SSM)
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          # 먼저 코드를 받고 나서 받은 deploy.sh를 실행한다 (처음 배포에도, 스크립트가 바뀌어도 최신 것으로)
          # ubuntu 사용자로 실행해야 GitHub Deploy key(~/.ssh)와 docker 권한을 쓸 수 있다
          cat > params.json <<'JSON'
          {
            "commands": [
              "sudo -u ubuntu -H bash -c 'cd /home/ubuntu/welfare-be && git fetch --quiet origin main && git merge --ff-only origin/main && bash deploy/deploy.sh'"
            ],
            "executionTimeout": ["1200"]
          }
          JSON
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM 명령: $CMD_ID"

          STATUS=Pending
          for i in $(seq 1 120); do          # 최대 20분 (첫 빌드는 Gradle 때문에 몇 분 걸린다)
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          echo "----- 서버 출력 -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "----- 서버 오류 출력 -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true
          echo "결과: $STATUS"
          test "$STATUS" = Success

# PR마다 테스트를 돌린다. 실패하면 merge 전에 알 수 있다
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x gradlew && ./gradlew test --no-daemon

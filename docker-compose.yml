# 운영 서버(EC2) 실행 구성. 사용법은 deploy/README.md
# DB는 여기 넣지 않는다. RDS를 쓴다 (백업·복구를 AWS가 맡도록)
services:
  app:
    build: .
    image: welfare-be
    restart: unless-stopped
    env_file: deploy/.env.prod          # DB_URL · DB_USERNAME · DB_PASSWORD
    environment:
      SPRING_PROFILES_ACTIVE: prod      # Dockerfile에도 있지만 한 번 더 못 박는다
    expose:
      - "8080"                          # 바깥에는 열지 않고 nginx만 접근한다

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    env_file: deploy/.env.prod          # API_DOMAIN
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro

  # 인증서 발급·갱신용. 평소에는 꺼져 있고 필요할 때만 실행한다 (deploy/README.md)
  certbot:
    image: certbot/certbot:v2.11.0
    profiles: ["tools"]
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
